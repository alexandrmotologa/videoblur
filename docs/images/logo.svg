<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- Watertight Base Silhouette Path (Sentinel Owl) -->
      <path d="
        M 0,-220
        L 70,-260 L 140,-300 L 130,-210 L 220,-160 L 250,-60 L 240,40
        L 210,160 L 160,250 L 120,310 L 60,330 L 0,350
        L -60,330 L -120,310 L -160,250 L -210,160 L -240,40
        L -250,-60 L -220,-160 L -130,-210 L -140,-300 L -70,-260
        Z
      " fill="#0b0f19" />

      <!-- Left Crown & Ear Tufts -->
      <polygon points="0,-220 -70,-260 -140,-300 -100,-210" fill="#1e293b" />
      <polygon points="0,-220 -100,-210 -50,-170" fill="#334155" />
      <polygon points="-100,-210 -140,-300 -130,-210 -170,-170" fill="#0f172a" />

      <!-- Right Crown & Ear Tufts -->
      <polygon points="0,-220 70,-260 140,-300 100,-210" fill="#334155" />
      <polygon points="0,-220 100,-210 50,-170" fill="#475569" />
      <polygon points="100,-210 140,-300 130,-210 170,-170" fill="#1e293b" />

      <!-- Brow Armor & Center Forehead -->
      <polygon points="0,-220 -50,-170 0,-120" fill="#475569" />
      <polygon points="0,-220 50,-170 0,-120" fill="#64748b" />
      <polygon points="0,-120 -50,-170 -90,-100 0,-60" fill="#1e293b" />
      <polygon points="0,-120 50,-170 90,-100 0,-60" fill="#334155" />

      <!-- Left Facial Disc Facets -->
      <polygon points="-50,-170 -170,-170 -220,-160 -180,-100 -90,-100" fill="#0f172a" />
      <polygon points="-220,-160 -250,-60 -180,-30 -180,-100" fill="#1e293b" />
      <polygon points="-180,-100 -180,-30 -90,-30 -90,-100" fill="#334155" />
      <polygon points="-180,-30 -250,-60 -240,40 -160,40 -90,-30" fill="#0f172a" />
      <polygon points="-90,-30 -160,40 -70,50 0,0" fill="#1e293b" />

      <!-- Right Facial Disc Facets -->
      <polygon points="50,-170 170,-170 220,-160 180,-100 90,-100" fill="#1e293b" />
      <polygon points="220,-160 250,-60 180,-30 180,-100" fill="#334155" />
      <polygon points="180,-100 180,-30 90,-30 90,-100" fill="#475569" />
      <polygon points="180,-30 250,-60 240,40 160,40 90,-30" fill="#1e293b" />
      <polygon points="90,-30 160,40 70,50 0,0" fill="#334155" />

      <!-- Left Optical Sensor Eye (Predator Cant, Cyan Glow) -->
      <polygon points="-90,-100 -40,-90 -25,-60 -60,-40 -105,-50" fill="#050811" />
      <polygon points="-85,-85 -45,-80 -35,-60 -65,-48 -95,-55" fill="url(#cyan-glow)" />
      <polygon points="-64,-82 -54,-80 -56,-50 -66,-52" fill="#031b33" />
      <polygon points="-58,-80 -50,-78 -52,-70 -60,-72" fill="#ffffff" opacity="0.9" />

      <!-- Right Optical Sensor Eye (Predator Cant, Cyan Glow) -->
      <polygon points="90,-100 40,-90 25,-60 60,-40 105,-50" fill="#050811" />
      <polygon points="85,-85 45,-80 35,-60 65,-48 95,-55" fill="url(#cyan-glow)" />
      <polygon points="64,-82 54,-80 56,-50 66,-52" fill="#031b33" />
      <polygon points="52,-80 60,-78 58,-70 50,-72" fill="#ffffff" opacity="0.9" />

      <!-- Geometric Beak / Sensor Core -->
      <polygon points="0,-60 -25,-20 0,25" fill="#f59e0b" />
      <polygon points="0,-60 25,-20 0,25" fill="#fbbf24" />
      <polygon points="0,25 -15,0 0,-15" fill="#b45309" />
      <polygon points="0,25 15,0 0,-15" fill="#d97706" />

      <!-- Neck & Throat Chevron Facets -->
      <polygon points="0,25 -70,50 -40,110 0,80" fill="#1e293b" />
      <polygon points="0,25 70,50 40,110 0,80" fill="#334155" />
      <polygon points="0,80 -40,110 0,150" fill="#475569" />
      <polygon points="0,80 40,110 0,150" fill="#64748b" />

      <!-- Chest & Breastplate Armor (Interlocking Chevrons) -->
      <polygon points="0,150 -60,160 -110,120 -40,110" fill="#0f172a" />
      <polygon points="0,150 60,160 110,120 40,110" fill="#1e293b" />
      <polygon points="0,150 -60,160 0,210" fill="#334155" />
      <polygon points="0,150 60,160 0,210" fill="#475569" />

      <!-- Lower Torso & Folded Wing Shells -->
      <polygon points="-60,160 -160,140 -210,160 -140,230 -60,220 0,210" fill="#0f172a" />
      <polygon points="60,160 160,140 210,160 140,230 60,220 0,210" fill="#1e293b" />
      <polygon points="0,210 -60,220 -100,280 0,270" fill="#1e293b" />
      <polygon points="0,210 60,220 100,280 0,270" fill="#334155" />

      <!-- Tail Plumes & Base Talons -->
      <polygon points="0,270 -60,280 -120,310 -50,330 0,350" fill="#0b0f19" />
      <polygon points="0,270 60,280 120,310 50,330 0,350" fill="#0f172a" />
      <polygon points="0,270 -50,330 0,350" fill="#1e293b" />
      <polygon points="0,270 50,330 0,350" fill="#334155" />

      <!-- Minimalist Cyan Node Pulse on Chest (Acoustic Bleep / Zero-Leak Core) -->
      <circle cx="0" cy="150" r="8" fill="#00f5ff" opacity="0.85" />
      <polygon points="0,138 4,146 12,150 4,154 0,162 -4,154 -12,150 -4,146" fill="#ffffff" opacity="0.9" />

    </g>
  </g>
</svg>